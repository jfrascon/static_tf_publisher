# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install
#
# To update this file:
#
#     pre-commit autoupdate

default_install_hook_types:
  - pre-commit
  - commit-msg

exclude: ^build/|^install/|^log/|^\.vscode/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # 25600 KiB = 25 MiB; ROS repositories may contain maintained image assets.
        args: [--maxkb=25600]
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
        # Use one deterministic line ending instead of preserving each file's majority style.
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude_types: [svg]
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
        args:
          - --branch=main
          - --branch=master

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Validate Python after Ruff applies its automatic changes.
  - repo: local
    hooks:
      - id: ament_flake8
        name: ament_flake8
        description: Validate Python with the package ROS 2 Flake8 configuration.
        entry: ament_flake8
        language: system
        types: [python]
        args: [--config=ament_flake8.ini]

      - id: ament_pep257
        name: ament_pep257
        description: Validate Python docstrings with the ROS 2 PEP 257 wrapper.
        entry: ament_pep257
        language: system
        types: [python]

      - id: ament_xmllint
        name: ament_xmllint
        description: Validate XML files with the ROS 2 XML wrapper.
        entry: ament_xmllint
        language: system
        types: [xml]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: [--no-schema]

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --preserve-quotes, --offset, "2"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --verbose
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
